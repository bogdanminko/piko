[project]
name = "piko"
version = "0.1.0"
description = "AI-powered viral subtitle generator for macOS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.4.1",
    "mlx-whisper>=0.4.3",
    "pillow>=12.3.0",
    "pysubs2>=1.8.0",
]

[project.scripts]
piko = "piko.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piko"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.0.2",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "S",             # bandit (security)
    "T20",           # no print/pprint — stdout is the JSON protocol
]
ignore = [
    "S603",  # subprocess without shell=True is exactly what we want
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest asserts

[tool.mypy]
python_version = "3.13"
files = ["src/piko", "tests"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["mlx_whisper.*", "pysubs2.*", "huggingface_hub.*", "PIL.*"]
ignore_missing_imports = true
