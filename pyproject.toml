[project]
name = "piko"
version = "0.1.0"
description = "AI-powered viral subtitle generator for macOS"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.4.1",
    "mlx-whisper>=0.4.3",
    "pillow>=12.3.0",
    "pysubs2>=1.8.0",
]

[project.scripts]
piko = "piko.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piko"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
