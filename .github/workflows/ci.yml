name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff / shellcheck / gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # gitleaks scans history
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: ruff check
        run: uvx ruff@0.16.0 check
      - name: ruff format --check
        run: uvx ruff@0.16.0 format --check
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Python (mypy / pytest)
    runs-on: macos-latest  # arm64 — mlx-whisper needs Apple Silicon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: mypy
        run: uv run mypy
      - name: pytest
        run: uv run pytest -q

  swift:
    name: Swift (build / swiftlint)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: swift build
        run: swift build
      - name: swiftlint
        run: |
          which swiftlint || brew install swiftlint
          swiftlint --strict --quiet
